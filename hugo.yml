baseURL: "https://blog.baoyuchen.top/"
title: "静水流深"
pagination:
  pagerSize: 10
theme: "PaperMod"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['$', '$']
            - ['\(', '\)']
        enable: true

enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
hasCJKLanguage: true
 

# 优化设置：生成纯净的 HTML
minify:
  disableXML: true
  minifyOutput: true

params:
  math: true
  env: production # 生产环境模式
  title: "静水流深"
  description: "基于 Hugo 的高性能博客"
  keywords: [Blog, Hugo, PaperMod]
  author: Yuchen
  ShowToc: true
  TocOpen: true
  
  # 界面显示设置
  defaultTheme: auto # 跟随系统自动切换黑白模式
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  useHugoToc: true
  ShowLastMod: true

  # # 首页设置
  # homeInfoParams:
  #   Title: "欢迎光临 👋"
  #   Content: "欢迎来到我的博客。这里由 Hugo 驱动，部署于 Vercel。"
   


  profileMode:
    enabled: false

  # 社交链接 (不需要的删掉)
  socialIcons:
    - name: github
      url: "https://github.com/xihuheyi007"
    - name: email
      url: "mailto:007@020720.xyz"

# 菜单栏配置
menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 时间轴
      url: /archives/
      weight: 30

assets:
    favicon: "/static/favicon.ico" # 对应 static 文件夹里的图片
    favicon16x16: "/static/favicon.ico"
    favicon32x32: "/static/favicon.ico"

label:
    text: "My Blog" # 左上角网站标题
    icon: "/static/favicon.ico" # 左上角小图标
    iconHeight: 35